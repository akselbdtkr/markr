<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markr grunnlag</title>
  <style>
    :root {
      --bg: #f4f2ec; --panel: #ffffff; --text: #22262b; --muted: #8a8f95;
      --border: #e2ded5; --handle: #2f6fd0;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #16181b; --panel: #1f2226; --text: #e6e6e3; --muted: #8d939a;
        --border: #33373c; --handle: #5b9bf0;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #16181b; --panel: #1f2226; --text: #e6e6e3; --muted: #8d939a;
      --border: #33373c; --handle: #5b9bf0;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      display: grid; grid-template-columns: 1fr 300px; height: 100%; overflow: hidden;
    }
    main { position: relative; min-width: 0; }
    #map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; background: #3d6fa8; }
    aside { background: var(--panel); border-left: 1px solid var(--border); padding: 18px 16px; overflow-y: auto; }
    h1 { font-size: 16px; font-weight: 600; margin: 0 0 10px; }
    #profile { width: 100%; height: 150px; margin-top: 10px; display: block; touch-action: none; outline: none; }
    #profile:focus-visible { outline: 2px solid var(--handle); outline-offset: 2px; }
    details.sec { border-top: 1px solid var(--border); padding: 10px 0 4px; }
    details.sec > summary { cursor: pointer; font-weight: 600; font-size: 13px; list-style: none; display: flex; justify-content: space-between; }
    details.sec > summary::after { content: "–"; color: var(--muted); }
    details.sec:not([open]) > summary::after { content: "+"; }
    details.sec > summary:focus-visible { outline: 2px solid var(--handle); outline-offset: 2px; }
    .grid { display: grid; grid-template-columns: 1fr 64px 52px; gap: 4px 6px; align-items: center; margin: 10px 0 6px; font-size: 13px; }
    .col-head { font-size: 11px; color: var(--muted); text-align: right; }
    .cell-name { display: flex; flex-direction: column; line-height: 1.2; }
    .type { color: var(--muted); font-size: 11px; }
    .grid input { width: 100%; font: inherit; font-size: 12px; text-align: right; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 3px; padding: 2px 4px; font-variant-numeric: tabular-nums; }
    .check { display: flex; gap: 6px; align-items: center; font-size: 13px; margin: 4px 0 8px; }
    .check input { margin: 0; accent-color: var(--handle); }
    .seed { display: flex; gap: 6px; margin-top: 12px; }
    .seed input, .seed button { font: inherit; font-size: 13px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; }
    .seed input { width: 0; flex: 1; }
    .seed button { cursor: pointer; }
    #pointbox {
      position: absolute; pointer-events: none; background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; font-size: 13px;
      display: flex; gap: 6px; align-items: center; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    #pointbox[hidden] { display: none; }
    .swatch { width: 10px; height: 10px; display: inline-block; }
    .h { color: var(--muted); margin-left: 4px; }
    @media (max-width: 720px) {
      body { grid-template-columns: 1fr; grid-template-rows: 58vh 1fr; height: auto; min-height: 100vh; overflow: auto; }
      aside { border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <main>
    <canvas id="map" aria-label="Kart over grunnforskyvningen"></canvas>
    <div id="pointbox" hidden></div>
  </main>
  <aside>
    <h1>Markr grunnlag</h1>
    <details class="sec" open>
      <summary>Grunnlagene</summary>
      <canvas id="profile" tabindex="0" aria-label="Profil: høyde etter verdien i laget. Dra strekene for å flytte tersklene."></canvas>
      <div id="layers" class="grid"></div>
    </details>
    <details class="sec" open>
      <summary>Mellomlaget</summary>
      <div id="midlayers" class="grid"></div>
      <label class="check"><input id="showMid" type="checkbox">Vis bare mellomlaget</label>
    </details>
    <div class="seed"><input id="seed" type="number" aria-label="Frø"><button id="reseed">Nytt frø</button></div>
  </aside>

  <script>window.Markr = { VERSION: 1 };</script>
  <script src="src/noise.js"></script>
  <script src="src/baselayer.js"></script>
  <script src="src/grunn.js"></script>
</body>
</html>
