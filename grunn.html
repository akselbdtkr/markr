<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markr grunnforskyvning</title>
  <style>
    :root {
      --bg: #f4f2ec; --panel: #ffffff; --text: #22262b; --muted: #8a8f95;
      --border: #e2ded5; --handle: #2f6fd0;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #16181b; --panel: #1f2226; --text: #e6e6e3; --muted: #8d939a;
        --border: #33373c; --handle: #5b9bf0;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #16181b; --panel: #1f2226; --text: #e6e6e3; --muted: #8d939a;
      --border: #33373c; --handle: #5b9bf0;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      display: grid; grid-template-columns: 1fr 300px; height: 100%; overflow: hidden;
    }
    main { position: relative; min-width: 0; }
    #map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; background: #3d6fa8; }
    aside { background: var(--panel); border-left: 1px solid var(--border); padding: 18px 16px; overflow-y: auto; }
    h1 { font-size: 16px; font-weight: 600; margin: 0 0 14px; }
    #profile { width: 100%; height: 170px; display: block; touch-action: none; outline: none; }
    #profile:focus-visible { outline: 2px solid var(--handle); outline-offset: 2px; }
    .layer { margin: 14px 0; }
    .layer-head { display: flex; justify-content: space-between; font-size: 13px; }
    .type { color: var(--muted); font-size: 12px; }
    .track { position: relative; height: 18px; cursor: pointer; touch-action: none; }
    .track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--muted); }
    .knob { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; background: var(--handle); }
    .knob:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    .seed { display: flex; gap: 6px; margin-top: 22px; }
    .seed input, .seed button { font: inherit; font-size: 13px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; }
    .seed input { width: 0; flex: 1; }
    .seed button { cursor: pointer; }
    hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
    #pointbox {
      position: absolute; pointer-events: none; background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; font-size: 13px;
      display: flex; gap: 6px; align-items: center; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    #pointbox[hidden] { display: none; }
    .swatch { width: 10px; height: 10px; display: inline-block; }
    .h { color: var(--muted); margin-left: 4px; }
    @media (max-width: 720px) {
      body { grid-template-columns: 1fr; grid-template-rows: 58vh 1fr; height: auto; min-height: 100vh; overflow: auto; }
      aside { border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <main>
    <canvas id="map" aria-label="Kart over grunnforskyvningen"></canvas>
    <div id="pointbox" hidden></div>
  </main>
  <aside>
    <h1>Grunnforskyvning</h1>
    <canvas id="profile" tabindex="0" aria-label="Profil: høyde etter verdien i laget. Dra strekene for å flytte tersklene."></canvas>
    <hr>
    <div id="layers"></div>
    <div class="seed"><input id="seed" type="number" aria-label="Frø"><button id="reseed">Nytt frø</button></div>
  </aside>

  <script>window.Markr = { VERSION: 1 };</script>
  <script src="src/noise.js"></script>
  <script src="src/baselayer.js"></script>
  <script src="src/grunn.js"></script>
</body>
</html>
