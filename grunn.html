<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markr grunnforskyvning</title>
  <style>
    :root {
      --bg: #f4f2ec; --panel: #ffffff; --text: #22262b; --muted: #6b7178;
      --border: #dcd8ce; --accent: #3f6f4a; --warn: #b4441c;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #16181b; --panel: #1f2226; --text: #e6e6e3; --muted: #9aa0a6;
        --border: #33373c; --accent: #8cc49a; --warn: #ff9a70;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #16181b; --panel: #1f2226; --text: #e6e6e3; --muted: #9aa0a6;
      --border: #33373c; --accent: #8cc49a; --warn: #ff9a70;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      display: grid; grid-template-columns: 1fr 300px; height: 100%; overflow: hidden;
    }
    main { position: relative; min-width: 0; }
    #map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; background: #1c3050; }
    aside { background: var(--panel); border-left: 1px solid var(--border); padding: 16px; overflow-y: auto; }
    h1 { font-size: 18px; margin: 0 0 2px; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 18px 0 8px; }
    .muted { color: var(--muted); }
    label { display: block; margin: 8px 0 2px; }
    label output { float: right; color: var(--muted); font-variant-numeric: tabular-nums; }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    input[type=number], button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; }
    button { cursor: pointer; }
    .row { display: flex; gap: 6px; }
    .row input { flex: 1; min-width: 0; }
    .check { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
    .check input { margin: 0; accent-color: var(--accent); }
    .check label { margin: 0; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; font-variant-numeric: tabular-nums; }
    dt { color: var(--muted); }
    dd { margin: 0; text-align: right; }
    dd.warn { color: var(--warn); }
    .hint { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
    .top { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; }
    .top button { background: var(--panel); }
    @media (max-width: 720px) {
      body { grid-template-columns: 1fr; grid-template-rows: 58vh 1fr; height: auto; min-height: 100vh; overflow: auto; }
      aside { border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <main>
    <canvas id="map"></canvas>
    <div class="top"><button id="home">Midten</button></div>
  </main>
  <aside>
    <h1>Markr grunnforskyvning</h1>
    <div class="muted">Det største laget, 100–500 km: hav, lavland, høyland og vanndeling, med store og små sund.</div>

    <h2>Hele laget</h2>
    <div id="ref"></div>
    <h2>Utsnittet</h2>
    <div id="viewstats"></div>
    <h2>Punkt</h2>
    <div id="hover"></div>

    <label for="seed">Frø</label>
    <div class="row"><input id="seed" type="number"><button id="reseed">Nytt</button></div>
    <div class="check"><input id="shade" type="checkbox"><label for="shade">Skygge</label></div>
    <div class="check"><input id="lines" type="checkbox"><label for="lines">Vis tersklene som linjer</label></div>

    <div id="controls"></div>
    <p class="hint">Dra for å flytte, rull eller knip for å zoome.</p>
  </aside>

  <script>window.Markr = { VERSION: 1 };</script>
  <script src="src/noise.js"></script>
  <script src="src/baselayer.js"></script>
  <script src="src/grunn.js"></script>
</body>
</html>
